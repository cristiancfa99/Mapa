name: Enable GitHub Pages

on:
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Enable GitHub Pages via API
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const res = await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                source: { branch: 'gh-pages', path: '/' }
              });
              console.log('✅ Pages habilitado:', res.data.html_url);
            } catch(e) {
              if (e.status === 409) {
                console.log('Pages ya estaba habilitado');
              } else {
                core.setFailed(e.message);
              }
            }
