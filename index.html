<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a73e8" />
    <title>GPS Santa María - Tigre</title>
    <script>
      window.__appLoaded = false;
      window.onerror = function(msg, src, line, col, err) {
        var b = document.getElementById('__boot');
        if (b) { b.style.background='#c00'; b.innerHTML='<b>Error JS:</b> ' + (err ? err.message : msg) + '<br><small>' + src + ':' + line + '</small>'; }
        return true;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var b = document.getElementById('__boot');
        if (b) { b.style.background='#c00'; b.innerHTML='<b>Error async:</b> ' + String(e.reason); }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-pHTY8S_p.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DVaMU8Du.css">
  </head>
  <body>
    <div id="__boot" style="position:fixed;top:0;left:0;right:0;background:#1a73e8;color:#fff;padding:12px 16px;font-family:sans-serif;font-size:14px;z-index:99999;text-align:center">
      📍 Cargando GPS Santa María...
    </div>
    <div id="root"></div>
    <script>
      // Hide boot bar once React mounts (#root gets children)
      var obs = new MutationObserver(function() {
        if (document.getElementById('root').children.length > 0) {
          var b = document.getElementById('__boot');
          if (b) b.remove();
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
      // Probe: fetch the actual module script URL to see the HTTP status
      setTimeout(function() {
        var ms = document.querySelector('script[type="module"][src]');
        var url = ms ? ms.src : '(no module script found)';
        fetch(url, {cache:'no-store'})
          .then(function(r) {
            var b = document.getElementById('__boot');
            if (b && b.parentNode) {
              b.style.background = r.ok ? '#137333' : '#c00';
              b.textContent = 'HTTP ' + r.status + ' ' + r.statusText + ' — ' + r.url;
            }
          })
          .catch(function(e) {
            var b = document.getElementById('__boot');
            if (b && b.parentNode) { b.style.background='#c00'; b.textContent = 'Fetch error: ' + String(e) + ' — url: ' + url; }
          });
      }, 3000);
    </script>
  </body>
</html>
